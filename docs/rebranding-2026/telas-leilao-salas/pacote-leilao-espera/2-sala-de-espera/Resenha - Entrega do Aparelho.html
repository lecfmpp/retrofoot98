<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Acabou a sua vez" description="Sobreposição de partida — Acabou a sua vez" -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1a12}
a{color:#F2B90C;text-decoration:none}
a:hover{color:#ffcb2e}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,185,12,.55)}50%{box-shadow:0 0 0 10px rgba(242,185,12,0)}}
@keyframes penDot{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-width:900px){ [data-ov-cols]{grid-template-columns:minmax(0,1fr)!important} }
</style>
</helmet>

<div style="min-height:100vh;box-sizing:border-box;padding:32px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#2f6f45 0%,#1d4a2e 55%,#0b1a12 100%)">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 44px,transparent 44px 88px);pointer-events:none"></div>

  <div style="position:relative;width:620px;max-width:100%;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -40px rgba(0,0,0,.7);display:flex;flex-direction:column;box-sizing:border-box">

    <div style="background:linear-gradient(100deg,#0e2f66,#17458F 62%);padding:18px 22px;display:flex;align-items:center;gap:14px;position:relative">
      <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:#F2B90C"></div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0;margin-left:6px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:#a9bfe0;white-space:nowrap">MODO RESENHA · RODADA CONCLUÍDA</span>
        <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Acabou a sua vez</span>
      </div>
      <div style="flex:1"></div>

    </div>

    <div style="padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
      <div style="background:#fff;border:1px solid #dde7db;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-sizing:border-box">
        <div style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:8px 0">
          <span style="font-size:34px">🤝</span>
          <span style="font-size:20px;font-weight:700;color:#12201a;text-wrap:pretty">Devolva o aparelho ao Gringo</span>
          <span style="font-size:13px;color:#5d6c62;line-height:1.6;max-width:360px;text-wrap:pretty">A rodada da Bea está gravada. Quem organiza a sala continua daqui.</span>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #dde7db;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-sizing:border-box">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span style="font-size:10px;font-weight:700;color:#8b978d;letter-spacing:.12em;white-space:nowrap">O QUE ACONTECEU NA SUA VEZ</span>
          
        </div>        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9aa79e;letter-spacing:.1em;white-space:nowrap">RESULTADO</span>
            <span style="font-size:16px;font-weight:700;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">3–0</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9aa79e;letter-spacing:.1em;white-space:nowrap">ADVERSÁRIO</span>
            <span style="font-size:16px;font-weight:700;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Cianorte</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9aa79e;letter-spacing:.1em;white-space:nowrap">PÚBLICO</span>
            <span style="font-size:16px;font-weight:700;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">6.240</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9aa79e;letter-spacing:.1em;white-space:nowrap">POSIÇÃO</span>
            <span style="font-size:16px;font-weight:700;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">1º no grupo</span>
          </div>
        </div>
      </div>
      <span style="font-size:12px;color:#78877c;line-height:1.55;text-wrap:pretty">Jogo gravado na nuvem.</span>
    </div>

    <div style="border-top:1px solid #eef1ee;background:#f7faf6;padding:14px 22px;display:flex;align-items:center;gap:10px;box-sizing:border-box">
<div style="flex:1"></div>
      <span style="height:44px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:#F2B90C;border:1px solid #F2B90C;color:#17458F;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer" style-hover="background:#ffcb2e">Entreguei o aparelho</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
