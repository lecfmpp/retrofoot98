<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-desk);font-family:var(--font-sans);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const DS = (function(){
  const guess = ['RetroFoot98DesignSystem2026','RetroFootDesignSystem','RetroFoot98DesignSystem','DS'];
  for (const g of guess) { try { const v = window[g]; if (v && typeof v === 'object') return v; } catch(e){} }
  for (const k of Object.getOwnPropertyNames(window)) {
    try { const v = window[k]; if (v && typeof v === 'object' && (v.HubScreen || v.Jersey || v.ClubBadge || v.StatBar || v.Button)) return v; } catch(e){}
  }
  return {};
})();
const { Jersey, AdBoard, FormationGrid, BenchList, Card, Button } = DS;
function Demo(){
  return (<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <Card><div style={{display:'flex',gap:22,alignItems:'center'}}>
      <Jersey number={9}/><Jersey number={1} goalkeeper/><Jersey number={5} captain/><Jersey number={15} size={34} bib/>
    </div></Card>
    <Card pad="8px"><AdBoard items={['⚽ ANUNCIE AQUI','SUA MARCA','PATROCÍNIO ⚽']}/></Card>
    <div style={{display:'grid',gridTemplateColumns:'1fr 200px',gap:14}}>
      <Card><FormationGrid active="3-3-4" footer={<Button variant="secondary" full>🟩 Seleccionar descansados</Button>}/></Card>
      <Card><BenchList total={4} width={168} groups={[{label:'DEFESA',players:[{number:13,name:'Kuhn Gustavo',force:7,energy:68},{number:14,name:'Renna',force:9,energy:72}]},{label:'ATAQUE',players:[{number:24,name:'Kauã Silva',force:10,energy:64},{number:26,name:'Igor Melo',force:8,energy:44}]}]}/></Card>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
