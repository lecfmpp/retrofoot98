<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-desk);font-family:var(--font-sans);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const DS = (function(){ for (const k of Object.getOwnPropertyNames(window)) { try { const v = window[k]; if (v && typeof v === 'object' && (v.Toast || v.Dialog || v.Button)) return v; } catch(e){} } return {}; })();
const { Toast } = DS;
function Demo(){
  if(!Toast) return <p style={{fontFamily:'system-ui',color:'#5d6c62'}}>Bundle do design system ainda não gerado.</p>;
  return (<div style={{display:'flex',flexDirection:'column',gap:10}}>
    <Toast tone="success">Jogo gravado na nuvem.</Toast>
    <Toast tone="warn">Caixa insuficiente para renovar este contrato.</Toast>
    <Toast tone="danger">Máximo de 3 substituições.</Toast>
    <Toast tone="progress">Conectando…</Toast>
    <Toast tone="info" glyph="🔨" action="Ver">Kaique arrematado por 120 mil.</Toast>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
