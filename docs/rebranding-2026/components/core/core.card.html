<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-desk);font-family:var(--font-sans);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const DS = (function(){
  const guess = ['RetroFoot98DesignSystem2026','RetroFootDesignSystem','RetroFoot98DesignSystem','DS'];
  for (const g of guess) { try { const v = window[g]; if (v && typeof v === 'object') return v; } catch(e){} }
  for (const k of Object.getOwnPropertyNames(window)) {
    try { const v = window[k]; if (v && typeof v === 'object' && (v.HubScreen || v.Jersey || v.ClubBadge || v.StatBar || v.Button)) return v; } catch(e){}
  }
  return {};
})();
const { Button, Chip, Card, SectionLabel, MenuBar } = DS;
function Demo(){
  return (<div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
      <Button variant="primary" pulse>⚽ Jogar</Button>
      <Button variant="secondary">🟩 Seleccionar descansados</Button>
      <Button variant="dark">Salvar</Button>
      <Button variant="pill">💾 Gravar</Button>
      <Button variant="quiet">Ver tabela completa…</Button>
      <Button variant="secondary" disabled>Indisponível</Button>
    </div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
      <Chip label="3-3-4" hint="F1" active/><Chip label="3-4-3" hint="F2"/><Chip label="4-4-2" hint="F5"/>
      <Chip label="Série D" active/><Chip label="Copa do Brasil"/><Chip label="🟢 Janela fecha em 2 dias" tone="info"/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      <Card><SectionLabel right="4º de 64">CLASSIFICAÇÃO · SÉRIE D</SectionLabel><span style={{fontSize:13,color:'var(--text-3)'}}>Card claro, hairline e raio 18.</span></Card>
      <Card tone="club"><SectionLabel>ADVERSÁRIO</SectionLabel><span style={{fontSize:19,fontWeight:700}}>Cianorte</span></Card>
    </div>
    <MenuBar activeIndex={1} items={[{icon:'🏠',label:'RetroFoot98'},{icon:'🥅',label:'Formação'},{icon:'👥',label:'Equipa'},'|',{icon:'✉️',label:'E-mail',badge:3}]}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
