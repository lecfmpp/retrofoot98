<!-- @dsCard group="Components" viewport="700x260" name="Brand — escudo e faixa do clube" subtitle="ClubBadge e ClubHeader" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-desk);font-family:var(--font-sans);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const DS = (function(){
  const guess = ['RetroFoot98DesignSystem2026','RetroFootDesignSystem','RetroFoot98DesignSystem','DS'];
  for (const g of guess) { try { const v = window[g]; if (v && typeof v === 'object') return v; } catch(e){} }
  for (const k of Object.getOwnPropertyNames(window)) {
    try { const v = window[k]; if (v && typeof v === 'object' && (v.HubScreen || v.Jersey || v.ClubBadge || v.StatBar || v.Button)) return v; } catch(e){}
  }
  return {};
})();
const { ClubBadge, ClubHeader, Button } = DS;
function Demo(){
  return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',gap:12,alignItems:'center'}}>
      <ClubBadge initials="XV" size={48} ring />
      <ClubBadge initials="CIA" size={36} background="var(--surface-card)" color="var(--club-primary)" radius={11} />
      <ClubBadge initials="AM" size={28} radius={9} />
    </div>
    <ClubHeader action={Button ? <Button variant="secondary">💾 Gravar</Button> : null} />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
