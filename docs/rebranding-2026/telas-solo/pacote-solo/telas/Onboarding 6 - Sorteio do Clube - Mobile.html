<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Onboarding — Sorteio do clube (mobile)" description="Onboarding — Sorteio do clube (mobile) — mobile" -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#c9d2cb}
a{color:#17458F;text-decoration:none}
a:hover{color:#0e2f66}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,185,12,.55)}50%{box-shadow:0 0 0 10px rgba(242,185,12,0)}}
@keyframes ballDrop{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="display:flex;justify-content:center;padding:24px;font-family:'Space Grotesk',system-ui,sans-serif">
  <div style="width:390px;flex:0 0 auto;background:#e8f0e7;border:1px solid #d2e0d0;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(20,33,26,.6);position:relative">
    <div style="background:linear-gradient(100deg,#0e2f66,#17458F 62%);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:#F2B90C"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-left:5px">
        <img src="uploads/pasted-1786581574687-0.png" alt="" style="width:28px;height:28px;object-fit:contain;flex:0 0 auto">
        <span style="font-size:14px;font-weight:700;color:#fff;white-space:nowrap">RetroFoot<span style="font-family:'IBM Plex Mono',monospace;color:#F2B90C">98</span></span>
        <div style="flex:1"></div>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#c3d3ec;white-space:nowrap">4 de 5</span>
      </div>
      <div style="display:flex;gap:4px;margin-left:5px">
        <span style="flex:1;height:4px;border-radius:99px;background:#F2B90C"></span>
        <span style="flex:1;height:4px;border-radius:99px;background:#F2B90C"></span>
        <span style="flex:1;height:4px;border-radius:99px;background:#F2B90C"></span>
        <span style="flex:1;height:4px;border-radius:99px;background:#F2B90C"></span>
        <span style="flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.22)"></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;margin-left:5px;padding-top:2px">
        <span style="font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.2;text-wrap:pretty">Sorteando os clubes…</span>
        <span style="font-size:12px;color:#c3d3ec;line-height:1.5;text-wrap:pretty">Cada treinador escolheu o país; o clube sai no sorteio.</span>
      </div>
    </div>
    <div style="padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px">
      <div style="background:linear-gradient(160deg,#0e2f66,#17458F);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center">
        <span style="font-size:9px;font-weight:600;letter-spacing:.12em;color:#c3d3ec;white-space:nowrap">O SEU CLUBE</span>
        <img src="uploads/pasted-1786581574687-0.png" alt="Escudo do XV de Piracicaba" style="width:64px;height:64px;object-fit:contain">
        <span style="font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em;white-space:nowrap">XV Piracicaba</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#F2B90C;white-space:nowrap">SÉRIE D · 2026</span>
        <div style="width:100%;display:flex;gap:6px;padding-top:4px">
          <div style="flex:1;min-width:0;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:8px;font-weight:700;color:#a9bfe0;letter-spacing:.1em;white-space:nowrap">ELENCO</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;white-space:nowrap">26</span>
          </div>
          <div style="flex:1;min-width:0;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:8px;font-weight:700;color:#a9bfe0;letter-spacing:.1em;white-space:nowrap">CAIXA</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;white-space:nowrap">1,27 mi</span>
          </div>
          <div style="flex:1;min-width:0;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:center">
            <span style="font-size:8px;font-weight:700;color:#a9bfe0;letter-spacing:.1em;white-space:nowrap">ESTÁDIO</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;white-space:nowrap">12.500</span>
          </div>
        </div>
      </div>
      <div style="background:#fff;border:1px solid #dde7db;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
          <span style="font-size:10px;font-weight:700;color:#8b978d;letter-spacing:.12em;white-space:nowrap">CLUBES SORTEADOS</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9aa79e;white-space:nowrap">3 / 4</span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:#eef3fa;animation:ballDrop .3s ease;min-width:0">
          <img src="assets/crests/vasco.png" alt="" style="width:22px;height:22px;object-fit:contain;flex:0 0 auto">
          <span style="flex:1;min-width:0;font-size:12px;font-weight:700;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Gringo — XV Piracicaba</span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:transparent;animation:ballDrop .3s ease;min-width:0">
          <img src="assets/crests/cruzeiro.png" alt="" style="width:22px;height:22px;object-fit:contain;flex:0 0 auto">
          <span style="flex:1;min-width:0;font-size:12px;font-weight:500;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Zé do Bairro — Cianorte</span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:transparent;animation:ballDrop .3s ease;min-width:0">
          <img src="assets/crests/fluminense.png" alt="" style="width:22px;height:22px;object-fit:contain;flex:0 0 auto">
          <span style="flex:1;min-width:0;font-size:12px;font-weight:500;color:#12201a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Marreco — Velo Clube</span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;border:1px dashed #c9d2ca">
          <span style="width:22px;height:22px;border-radius:99px;background:#eef1ee;flex:0 0 auto"></span>
          <span style="flex:1;min-width:0;font-size:12px;color:#9aa79e;white-space:nowrap">Tiu — sorteando…</span>
          <span style="font-size:13px;flex:0 0 auto">⚽</span>
        </div>
        <div style="height:8px;border-radius:99px;background:#eef1ee;overflow:hidden"><div style="width:75%;height:100%;border-radius:99px;background:#17458F"></div></div>
      </div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde7db;padding:12px 16px 16px;display:flex;gap:8px">
      
      <span style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:#fff;border:1px solid #d8e2d6;color:#3a473f;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer">⏩ Acelerar</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
