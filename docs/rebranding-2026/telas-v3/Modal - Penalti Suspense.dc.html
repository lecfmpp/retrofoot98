<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Carlos Miguel na bola" description="Sobreposição de partida — Carlos Miguel na bola" -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1a12}
a{color:#F2B90C;text-decoration:none}
a:hover{color:#ffcb2e}
@keyframes ctaPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,185,12,.55)}50%{box-shadow:0 0 0 10px rgba(242,185,12,0)}}
@keyframes penDot{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-width:900px){ [data-ov-cols]{grid-template-columns:minmax(0,1fr)!important} }
</style>
</helmet>

<div style="min-height:100vh;box-sizing:border-box;padding:32px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#2f6f45 0%,#1d4a2e 55%,#0b1a12 100%)">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 44px,transparent 44px 88px);pointer-events:none"></div>

  <div style="position:relative;width:720px;max-width:100%;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -40px rgba(0,0,0,.7);display:flex;flex-direction:column;box-sizing:border-box">

    <div style="background:linear-gradient(100deg,#0e2f66,#17458F 62%);padding:18px 22px;display:flex;align-items:center;gap:14px;position:relative">
      <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:#F2B90C"></div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0;margin-left:6px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:#a9bfe0;white-space:nowrap">2º TEMPO · 78′ · XV 1 × 1 CIANORTE</span>
        <span style="font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Carlos Miguel na bola</span>
      </div>
      <div style="flex:1"></div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#F2B90C;white-space:nowrap;flex:0 0 auto">CANTO ESQUERDO</span>
    </div>

    <div style="padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
        <div style="position:relative;height:150px;border-radius:14px;background:repeating-linear-gradient(180deg,#3e9c5a 0 40px,#37904f 40px 80px);overflow:hidden;box-shadow:inset 0 14px 30px -18px rgba(0,0,0,.5)">
          <div style="position:absolute;left:50%;top:14px;transform:translateX(-50%);width:230px;height:74px;border:3px solid rgba(255,255,255,.85);border-top-width:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 11px),repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 1px,transparent 1px 11px);box-sizing:border-box"></div>
          <div style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:9px;height:9px;border-radius:99px;background:#fff"></div>
          <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Georgia',serif;font-style:italic;font-size:34px;font-weight:700;color:rgba(255,255,255,.95);white-space:nowrap;text-shadow:0 4px 16px rgba(0,0,0,.5)">…</span>
        </div>

      <div style="background:#fff;border:1px solid #dde7db;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-sizing:border-box">
        <div style="display:flex;flex-direction:column;gap:12px;align-items:center;padding:6px 0">
          <span style="font-family:'Georgia',serif;font-style:italic;font-size:22px;color:#12201a;text-align:center;text-wrap:pretty">O estádio inteiro em silêncio.</span>
          <div style="display:flex;gap:10px">
            <span style="width:12px;height:12px;border-radius:99px;background:#17458F;animation:penDot 1.1s 0s ease-in-out infinite"></span><span style="width:12px;height:12px;border-radius:99px;background:#17458F;animation:penDot 1.1s 0.18s ease-in-out infinite"></span><span style="width:12px;height:12px;border-radius:99px;background:#17458F;animation:penDot 1.1s 0.36s ease-in-out infinite"></span>
          </div>
          <span style="font-size:12px;color:#78877c;white-space:nowrap">4.812 pessoas no Barão de Serra Negra</span>
        </div>
      </div>
      
    </div>

    <div style="border-top:1px solid #eef1ee;background:#f7faf6;padding:14px 22px;display:flex;align-items:center;gap:10px;box-sizing:border-box">
<div style="flex:1"></div>
      <span style="height:44px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:#F2B90C;border:1px solid #F2B90C;color:#17458F;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer" style-hover="background:#ffcb2e">⏩ Ver o resultado</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
