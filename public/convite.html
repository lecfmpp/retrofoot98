<!-- =====================================================================
     PÁGINA DO CONVITE DA RESENHA — ela existe POR CAUSA DA PRÉ-VISUALIZAÇÃO.
     ---------------------------------------------------------------------
     O WhatsApp (e o Telegram, e o Facebook) lê o HTML no SERVIDOR, antes de
     qualquer JavaScript correr: o cartão que aparece no chat sai destas meta
     tags, e não do que o jogo desenha. Enquanto o convite era `/?sala=CODIGO`
     ele caía no index.html e mostrava a logo do site — o criativo publicado
     no painel em `rf98.resenha.invite` só era visto DENTRO do jogo, na
     pré-visualização do modal "Chamar pra Resenha".

     Esta página serve só para o cartão. Quem a abre é levado para a sala num
     piscar de olhos (ver o script no fim), e o jogo continua a entrar por
     `?sala=CODIGO` como sempre — os links já partilhados não quebram.

     A IMAGEM É UMA MORADA FIXA, e isso é de propósito. `atual.png` é
     reescrito pelo painel a cada publicação nesta chave (ver CHAVES_MORADA_FIXA
     em public/admin/admin.js): trocar a arte no painel troca o cartão sem
     republicar o site. O nome do ficheiro é sempre .png, mas quem manda para
     os robôs de pré-visualização é o Content-Type que o Storage devolve — a
     extensão aqui é só um rótulo estável.

     O WHATSAPP GUARDA O CARTÃO EM CACHE por alguns dias. Depois de trocar a
     arte, um link JÁ partilhado continua a mostrar a antiga; um link novo
     mostra a nova.
     ===================================================================== -->

<style>
  html,body{height:100%;margin:0}

<body>
  <img src="https://alxwgqvjmetjbbqtjkhx.supabase.co/storage/v1/object/public/publicidade/rf98.resenha.invite/atual.png"
       alt="Bora pro RetroFoot?">
  <p>A abrir a tua sala na Resenha…</p>
  <a id="ir" href="/">Entrar agora</a>

<script>
/* O CÓDIGO DA SALA VEM DO CAMINHO, e o destino é o mesmo de sempre: `?sala=`.
   O jogo inteiro já sabe entrar por esse parâmetro (ver resenhaRememberRoomInUrl
   em src/net/local-transport.js) — esta página não aprende nada sobre salas, só
   traduz `/convite/CODIGO` no endereço que o jogo já entende. Sem código, leva
   à entrada do jogo em vez de a lado nenhum. */
(function(){
  var m = /\/convite\/([^/?#]+)/.exec(location.pathname);
  var cod = m ? decodeURIComponent(m[1]) : (new URLSearchParams(location.search).get('sala') || '');
  cod = String(cod).trim().toUpperCase().slice(0, 32).replace(/[^A-Z0-9-]/g, '');
  var destino = cod ? '/?sala=' + encodeURIComponent(cod) : '/';
  document.getElementById('ir').href = destino;
  /* `replace` e não `href`: o botão "voltar" do telemóvel tem de sair do jogo,
     não regressar a esta página e reencaminhar outra vez em ciclo. */
  location.replace(destino);
})();
</script>
</body>
