<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel dos sócios — RetroFoot98</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- AUTENTICAÇÃO: os três telas vivem no mesmo split-screen (handoff). O painel só
     aparece depois de adm_reivindicar_convite() confirmar que a conta é de admin. -->
<div id="auth" class="auth hide">
  <div class="auth-l">
    <div class="brand">
      <img src="logo.webp" alt="">
      <b>RetroFoot98</b>
      <span class="pill-admin">Admin</span>
    </div>
    <div style="max-width:420px">
      <h1>O estado do projeto, num lugar só.</h1>
      <p class="auth-lead">Receita, despesa, lucro e engajamento dos treinadores — os números que os sócios usam para decidir o próximo passo.</p>
      <div class="auth-stats" id="auth-stats"></div>
    </div>
    <div class="auth-foot">Acesso restrito aos sócios · sessão registrada</div>
  </div>
  <div class="auth-r"><div class="auth-form" id="auth-form"></div></div>
</div>

<!-- PAINEL -->
<div id="app" class="app hide">
  <!-- BARRA DO TELEMÓVEL: só aparece abaixo de 900px (CSS). O hambúrguer abre a
       gaveta com a mesma navegação da lateral — nada de menu duplicado. -->
  <div class="mob-top">
    <button class="mob-btn" id="mob-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <img src="logo.webp" alt="">
    <b id="mob-tit">Painel dos sócios</b>
  </div>
  <div class="side-fundo" id="side-fundo"></div>

  <aside>
    <div class="side-brand">
      <img src="logo.webp" alt="">
      <div style="line-height:1.15">
        <div style="font-weight:800;font-size:14px;letter-spacing:-.2px">RetroFoot98</div>
        <div style="font-size:11px;color:var(--dim2)">Painel dos sócios</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-user">
      <i class="av" id="me-av">··</i>
      <div style="flex:1;line-height:1.2;min-width:0">
        <div style="font-size:12.5px;font-weight:700" id="me-nome">—</div>
        <div style="font-size:11px;color:var(--dim2)" id="me-papel">—</div>
      </div>
      <span id="sair" style="font-size:15px;color:var(--dim2);cursor:pointer" title="Sair">⎋</span>
    </div>
  </aside>

  <main>
    <header>
      <div style="flex:1;min-width:0">
        <h1 id="pg-tit">Visão geral</h1>
        <p id="pg-sub">—</p>
      </div>
      <div class="per" id="periodos"></div>
    </header>
    <div class="page" id="page"></div>
  </main>
</div>

<div id="modais"></div>
<div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0"></script>
<script src="admin.js"></script>
</body>
</html>
