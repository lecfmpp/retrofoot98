<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — Resenha 2 clientes</title>
<style>
  body{margin:0;font:13px/1.4 -apple-system,system-ui,sans-serif;background:#12224a;color:#eee;display:flex;flex-direction:column;height:100vh}
  #bar{flex:none;display:flex;gap:8px;align-items:center;padding:8px;background:#0a1330;flex-wrap:wrap}
  #bar button{font:inherit;padding:6px 10px;cursor:pointer}
  #frames{flex:1;display:flex;min-height:0}
  #frames iframe{flex:1;border:0;border-right:2px solid #0a1330;background:#fff}
  #log{flex:none;height:180px;overflow:auto;background:#000;color:#9fdf9f;font:11px/1.5 ui-monospace,monospace;padding:6px 10px;white-space:pre-wrap}
  .ok{color:#7CFC00}.fail{color:#ff6b6b;font-weight:700}.info{color:#8ab4ff}
</style>
</head>
<body>
<div id="bar">
  <b>HARNESS</b>
  <button onclick="setup()">1· Criar sala + entrar</button>
  <button onclick="start()">2· Iniciar (host)</button>
  <button onclick="scenario()">▶ Cenário 1: lockstep (Série D)</button>
  <button onclick="scenario2()">▶ Cenário 2: COPAS (Série A, quarta/sábado)</button>
  <button onclick="scenario3()">▶ Cenário 3: 365ZV (dois fora das copas, até a jornada 3)</button>
  <button onclick="hz.timerMs=8000">timer 8s</button>
  <span id="st" class="info"></span>
</div>
<div id="frames">
  <!-- sandbox SEM allow-top-navigation: nenhum código dentro do jogo pode navegar o runner
       (aconteceu na 1ª execução do cenário 2 — o top virou o jogo no meio do teste; com o
       sandbox, a tentativa vira erro de console e aponta o culpado em vez de matar o teste) -->
  <iframe id="fA" src="/?harness=A" sandbox="allow-scripts allow-same-origin allow-modals allow-popups"></iframe>
  <iframe id="fB" src="/?harness=B" sandbox="allow-scripts allow-same-origin allow-modals allow-popups"></iframe>
</div>
<div id="log"></div>
<script>
/* ============ SERVIDOR DE MENTIRA (__HSRV) ============
   Semântica fiel às RPCs de produção:
   - start_running: EXCLUSIVA do anfitrião — a largada, que carimba o snapshot de escalações.
     O cronômetro (arm_ready_timer) e o avanço por prazo (advance_phase_if_expired) não existem
     mais: quem diz que todos chegaram é o carimbo do dia (dayAck), e quem segue sem alguém é o
     anfitrião, por botão.
   - reopen_ready: fase 'running' -> 'ready', is_ready=false.
   - openSeason (netStart novo): 'ready' com timer DESARMADO.                              */
const hz={ games:{}, timerMs:60000 };
function bcast(code){
  // ASSÍNCRONO de propósito: o realtime de produção nunca reentra na mesma pilha. O bcast
  // síncrono fazia o onState rodar DENTRO de uma chamada do próprio cliente (ex.: no meio do
  // startCupLiveMatch, antes de CL.live existir) e a rede de segurança reentrava na rodada —
  // uma corrida que só existe no harness.
  setTimeout(()=>{ for(const f of [fA,fB]){ try{ f.contentWindow.__hOnServerUpdate && f.contentWindow.__hOnServerUpdate(code); }catch(e){} } }, 0);
}
function G(code){ return hz.games[code]; }
window.__HSRV={
  snapshot(code){ const g=G(code); return g?JSON.parse(JSON.stringify(g)):null; },
  createGame(name, uid, pname){ const code='HARN'+Math.floor(Math.random()*90+10);
    hz.games[code]={ code, name, hostId:uid, phase:'lobby', round:0, ready_deadline:0, paused:false,
      seed:(Math.random()*1e9)>>>0, players:{}, seats:{}, shared:null, sharedVersion:0,
      kickoff_lineups:null, kickoff_at:null };
    hz.games[code].players[uid]={name:pname}; hz.games[code].seats[uid]={};
    log('SRV: sala '+code+' criada por '+uid,'info'); return code; },
  join(code, uid, pname){ const g=G(code); if(!g) throw new Error('sala inexistente');
    g.players[uid]={name:pname}; g.seats[uid]=g.seats[uid]||{}; bcast(code); },
  rename(code, uid, name){ const g=G(code); if(g&&g.players[uid]){ g.players[uid].name=name; bcast(code); } },
  assignSeats(code, pool){ const g=G(code); let i=0;
    Object.keys(g.players).forEach(uid=>{ g.seats[uid]=g.seats[uid]||{}; g.seats[uid].club_id=pool[i++]; g.seats[uid].is_ready=false; });
    bcast(code); },
  setClub(code, uid, clubId){ const g=G(code); g.seats[uid]=g.seats[uid]||{}; g.seats[uid].club_id=clubId; bcast(code); },
  openSeason(code){ const g=G(code); g.phase='ready'; g.ready_deadline=0; g.paused=false;
    Object.values(g.seats).forEach(s=>s.is_ready=false);
    log('SRV: temporada aberta — fase ready, timer DESARMADO','info'); bcast(code); },
  setReady(code, uid, v){ const g=G(code); if(!g.seats[uid]) return; g.seats[uid].is_ready=!!v; bcast(code); },
  /* HEARTBEAT DE PRESENÇA — era um no-op, e isso tornava o mock infiel justamente na regra que
     decide se a sala espera por alguém. Em produção `netHeartbeatSeen` carimba `last_seen` no
     assento a cada ~15s enquanto o jogo está aberto, e é esse carimbo que o `day_ack` com prazo
     consulta para saber quem sumiu. Sem ele, todo assento do harness parecia ausente e a rede de
     segurança dos 45s dispensava a sala inteira — um falso positivo que só existia aqui. */
  seen(code, uid){ const g=G(code); if(g && g.seats[uid]) g.seats[uid].last_seen=Date.now(); },
  startRunning(code){ const g=G(code); if(g.phase==='running') return 'running';
    g.phase='running'; g.kickoff_at=Date.now();
    g.kickoff_lineups={}; Object.values(g.seats).forEach(s=>{ if(s.club_id&&s.last_xi) g.kickoff_lineups[s.club_id]={xi:s.last_xi,tactic:s.last_tactic||'equilibrado'}; });
    bcast(code); return 'running'; },
  reopenReady(code){ const g=G(code); if(g.phase!=='running') return g.phase;
    g.phase='ready'; g.ready_deadline=0;
    Object.values(g.seats).forEach(s=>s.is_ready=false);
    log('SRV: rodada reaberta — fase ready, timer desarmado','info'); bcast(code); return 'ready'; },
  seatPatch(code, uid, patch){ const g=G(code); if(!g.seats[uid]) return; Object.assign(g.seats[uid], patch); bcast(code); },
  /* games.round TEM UM ESCRITOR SÓ: o ponteiro. Em sala com plano de dias o save do anfitrião
     publica só o MUNDO — quem escreve a jornada é o dayAck, a partir do plano (item 3,
     mesma regra do netSaveGame de produção). */
  saveShared(code, S, round){ const g=G(code); g.shared=S; g.sharedVersion++;
    if(!g.day_plan) g.round=round||S.round||0;
    log('SRV: shared_state salvo v'+g.sharedVersion+' (rodada '+g.round+')','info'); bcast(code); },
  loadShared(code){ const g=G(code); return g.shared?{S:g.shared, version:g.sharedVersion}:null; },

  /* ============ PONTEIRO DE DIA ============
     Porta as funções de elifoot_v3 com a MESMA semântica. UMA função só move o ponteiro — o
     dayAck. As outras duas que existiam aqui (dayAdvanceIfAllDone, daySync) foram apagadas junto
     com as do banco: enquanto existiam, era por elas que o jogo andava, e o carimbo — que é o
     modelo de verdade — ficava sem exercício nenhum. */
  dayPlanSet(code, plan){ const g=G(code); if(!g || g.day_plan) return;     // nunca sobrescreve (igual à produção)
    g.day_plan=plan; g.day_idx=0; g.day_moment='escalando';
    log('SRV: plano de dias gravado ('+plan.length+' dias)','info'); bcast(code); },
  dayCurrent(code){ const g=G(code); if(!g||!g.day_plan) return null;
    const e=g.day_plan[g.day_idx]; if(!e) return null;
    return { idx:g.day_idx, momento:g.day_moment, jornada:e.r, competicao:e.comp,
             dia_da_temporada:e.dia, total_dias:g.day_plan.length }; },
  /* desfaz o carimbo do próprio assento — mesma semântica da RPC day_unack (nunca move o dia) */
  dayUnack(code, uid, idx, moment){ const g=G(code); if(!g||!g.day_plan) return null;
    if(idx===g.day_idx && moment===g.day_moment && g.seats[uid]){ g.seats[uid].day_ack=null; g.seats[uid].is_ready=false; bcast(code); }
    return this.dayStatus(code); },
  dayStatus(code){ const g=G(code); if(!g||!g.day_plan) return null;
    const cur=this.dayCurrent(code); if(!cur) return null;
    const chave=g.day_idx+':'+g.day_moment;
    const faltando=Object.keys(g.seats).filter(id=>g.seats[id].club_id!=null && g.seats[id].day_ack!==chave);
    return Object.assign({}, cur, { faltam:faltando.length,
      nomes_faltando:faltando.map(id=>(g.players[id]||{}).name||'?') }); },
  /* SEMÂNTICA NOVA — carimbo explícito, e a JORNADA sai do ponteiro (games.round derivado). */
  dayAck(code, uid, idx, moment, ignorarSeg){ const g=G(code); if(!g||!g.day_plan) return null;
    const chave=g.day_idx+':'+g.day_moment;
    if(idx===g.day_idx && moment===g.day_moment && g.seats[uid]) g.seats[uid].day_ack=chave;
    // NEGATIVO = liberação explícita do anfitrião ("começar sem eles"), vale inclusive para quem
    // está presente e parado; positivo dispensa só quem sumiu; zero espera todos. Mesma semântica
    // da RPC de produção.
    /* NULO É AUSÊNCIA, NÃO PRESENÇA — mesma regra da RPC de produção (migração
       day_ack_assento_sem_sinal_de_vida_nao_trava_a_sala, 18/08/2026). Aqui o mock tratava
       `last_seen` ausente como "está na sala" e segurava o dia para sempre; no banco eram 30%
       dos assentos. Um mock com semântica diferente da RPC é a mesma armadilha das duas versões
       da mesma regra: o cenário passa e a sala trava. */
    const faltam=(ignorarSeg<0) ? 0 : Object.keys(g.seats).filter(id=>{ const s=g.seats[id];
      if(s.club_id==null || s.day_ack===chave) return false;
      if(ignorarSeg>0) return !!(s.last_seen && Date.now()-s.last_seen <= ignorarSeg*1000);
      return true; }).length;
    if(faltam===0){
      if(g.day_moment==='escalando') g.day_moment='jogando';
      else if(g.day_moment==='jogando') g.day_moment='classificacao';
      else if(g.day_idx+1<g.day_plan.length){ g.day_idx++; g.day_moment='escalando'; }
      const e=g.day_plan[g.day_idx]; if(e && e.r!=null) g.round=e.r;     // a jornada É o ponteiro
      Object.values(g.seats).forEach(s=>{ s.day_ack=null; });
    }
    bcast(code); return this.dayStatus(code); },
};

/* ============ RUNNER ============ */
const $log=document.getElementById('log');
window.__HLOG=(uid,m)=>{ log('['+uid+'] '+m, uid==='A'?'info':''); };
function log(m,cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=m; $log.appendChild(d); $log.scrollTop=1e9;
  // evidência sobrevive a navegação/reload do runner
  try{ const a=JSON.parse(localStorage.getItem('hlog')||'[]'); a.push((cls||'')+ '|' +m); localStorage.setItem('hlog', JSON.stringify(a.slice(-400))); }catch(e){} }
try{ const prev=JSON.parse(localStorage.getItem('hlog')||'[]');
  if(prev.length){ const d=document.createElement('div'); d.style.opacity=.5; d.textContent='—— log da execução anterior ——\n'+prev.map(l=>l.split('|').slice(1).join('|')).join('\n')+'\n—— fim ——'; $log.appendChild(d); localStorage.removeItem('hlog'); } }catch(e){}
function assert(cond,label){ log((cond?'✔ ':'✘ ')+label, cond?'ok':'fail'); if(!cond) throw new Error('ASSERT: '+label); }
const A=()=>fA.contentWindow, B=()=>fB.contentWindow;
const stA=()=>A().__h.state(), stB=()=>B().__h.state();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,label,timeout){ const t0=Date.now();
  while(Date.now()-t0<(timeout||30000)){
    try{ if(fn()) { log('… '+label,'ok'); return; } }catch(e){}
    // empurra telas de passagem nos dois lados (classificações, apresentações, pausa) — sem isto
    // uma tela automática de 10s por cliente soma minutos ao teste e mascara o que é travamento real
    try{ A().__h.fast(); }catch(e){} try{ B().__h.fast(); }catch(e){}
    await sleep(200); }
  throw new Error('TIMEOUT: '+label+' | A='+JSON.stringify(stA())+' B='+JSON.stringify(stB())); }
let CODE=null;
async function setup(){
  await waitFor(()=>A().__h && B().__h,'clientes carregados');
  CODE=await A().__h.hostCreate('SALA HARNESS');
  await B().__h.join(CODE);
  log('sala '+CODE+' com A(host)+B','info'); st.textContent='sala '+CODE;
}
function start(){ A().__h.lobbyStart(); }
/* mantém as cerimônias andando (acelera nos dois lados) até os dois chegarem à tela alvo */
async function fastUntil(screenSet,label,timeout){
  await waitFor(()=>{ A().__h.fast(); B().__h.fast();
    return screenSet.includes(stA().screen) && screenSet.includes(stB().screen); },label,timeout);
}
/* ---- gravador de estados: base das asserções de simultaneidade e do detector de loop ---- */
let REC=null, hist={A:[],B:[]};
function startRecorder(){ hist={A:[],B:[]};
  REC=setInterval(()=>{ try{ hist.A.push(stA()); }catch(e){} try{ hist.B.push(stB()); }catch(e){} },150); }
function stopRecorder(){ if(REC){ clearInterval(REC); REC=null; } }
function saw(c,pred){ return hist[c].some(pred); }
/* quantas vezes cada cliente ENTROU ao vivo em cada (rodada, competição) — entrada dupla = loop */
function entryCounts(c){ const out={}; let prevLive=false;
  for(const s of hist[c]){ if(s.live&&!prevLive){ const k=s.round+':'+(s.cupKey||'liga'); out[k]=(out[k]||0)+1; } prevLive=s.live; }
  return out; }

/* ---- CENÁRIO 2: Série A com sorteio arranjado (assento 1 = clube da Libertadores 2026,
   assento 2 = da Sul-Americana) e semanas de DOIS ESTÁGIOS (quarta de copa / sábado de liga,
   via NET.resolveRound do harness). É o teste que o cenário 1 não cobria. ---- */
async function scenario2(){
  try{
    hz.timerMs=8000; hz.games={}; CODE=null;
    window.__HDIV='A'; window.__HRIG='cups';
    fA.src='/?harness=A&t='+Date.now(); fB.src='/?harness=B&t='+Date.now();
    await sleep(1400);
    await setup();
    await sleep(200);            // bcast agora é assíncrono (fiel ao realtime): deixa o join do B aterrissar no A
    start(); startRecorder();
    await waitFor(()=>stA().netStep==='reveal'&&stB().netStep==='reveal','reveal nos DOIS');
    await fastUntil(['main'],'cerimônias (CdB+Lib+Sula) até o clube — Série A',300000);
    log('clubes: A='+stA().myClub+' (Lib) · B='+stB().myClub+' (Sula)','info');
    // ---------- AUTOPILOTO ATÉ A RODADA 3 ----------
    // O fluxo real anda sozinho (cronômetro soberano + telas automáticas); janelas instantâneas
    // são impossíveis de agarrar do lado de fora. O runner só faz o papel dos DEDOS (clicar Jogar
    // quando a fase abre) e valida TUDO pelo histórico gravado, depois.
    const t0=Date.now(); let lastReadyPoke=0;
    while(hz.games[CODE].round<3 && Date.now()-t0<600000){
      const g=hz.games[CODE];
      if(g.phase==='ready' && Date.now()-lastReadyPoke>3000){
        lastReadyPoke=Date.now();
        try{ if(stA().screen==='main'&&!stA().live) A().__h.jogar(); }catch(e){}
        try{ if(stB().screen==='main'&&!stB().live) B().__h.jogar(); }catch(e){}
      }
      try{ A().__h.fast(); }catch(e){} try{ B().__h.fast(); }catch(e){}
      await sleep(250);
    }
    await waitFor(()=>hz.games[CODE].round>=3,'mundo chegou à rodada 3 (r0 liga + r1 lib+liga + r2 sula+liga)',60000);
    await fastUntil(['main'],'os dois de volta ao clube',240000);
    // ---------- VALIDAÇÃO POR HISTÓRICO ----------
    assert(saw('A',s=>s.live&&s.cupKey==='libertadores'&&s.round===1),'A esteve AO VIVO na Libertadores (r1)');
    assert(saw('B',s=>s.live&&s.cupKey==='libertadores'&&s.round===1),'B esteve AO VIVO na Libertadores (r1) mesmo sem disputar');
    assert(saw('A',s=>s.live&&s.cupKey==='sulamericana'&&s.round===2),'A esteve AO VIVO na Sul-Americana (r2) mesmo sem disputar');
    assert(saw('B',s=>s.live&&s.cupKey==='sulamericana'&&s.round===2),'B esteve AO VIVO na Sul-Americana (r2)');
    assert(saw('A',s=>s.screen==='cupclassif'&&s.round===1)&&saw('B',s=>s.screen==='cupclassif'&&s.round===1),'classificação da Lib nos DOIS (r1)');
    assert(saw('A',s=>s.screen==='cupclassif'&&s.round===2)&&saw('B',s=>s.screen==='cupclassif'&&s.round===2),'classificação da Sula nos DOIS (r2)');
    // ---------- "BOTAFOGO 4 PTS PRA UM, 7 PRA OUTRO" (relato do dono, 21/08) ----------
    // Compara, clube a clube, os pontos que A e B enxergam na MESMA tela de classificação de
    // copa — não só se os dois chegaram lá (isso já passava). Qualquer clube com número
    // diferente entre A e B é o bug relatado, e o log lista quais.
    const gruposA=hist.A.filter(s=>s.screen==='cupclassif'&&s.grupoPts);
    const gruposB=hist.B.filter(s=>s.screen==='cupclassif'&&s.grupoPts);
    log('snapshots de grupo A='+gruposA.length+' B='+gruposB.length,'info');
    const divergencias=[];
    gruposA.forEach(sa=>{
      const sb=gruposB.find(x=>x.round===sa.round);
      if(!sb) return;
      Object.keys(sa.grupoPts).forEach(clubeId=>{
        const pa=sa.grupoPts[clubeId], pb=sb.grupoPts[clubeId];
        if(pb!=null && pa!==pb) divergencias.push(`rodada ${sa.round} · ${clubeId}: A=${pa} × B=${pb}`);
      });
    });
    if(divergencias.length) log('DIVERGÊNCIAS: '+divergencias.join(' | '),'fail');
    assert(divergencias.length===0,'A e B veem os MESMOS pontos pra cada clube do grupo, sempre');
    assert(saw('A',s=>s.live&&!s.cupKey&&s.round===1)&&saw('B',s=>s.live&&!s.cupKey&&s.round===1),'liga da r1 nos DOIS (sábado depois da quarta)');
    // ---------- DETECTOR DE LOOP ----------
    const eA=entryCounts('A'), eB=entryCounts('B');
    log('entradas ao vivo A='+JSON.stringify(eA),'info'); log('entradas ao vivo B='+JSON.stringify(eB),'info');
    assert(Object.values(eA).every(n=>n===1),'A nunca reentrou numa etapa (anti-loop)');
    assert(Object.values(eB).every(n=>n===1),'B nunca reentrou numa etapa (anti-loop)');
    assert(stA().round===stB().round,'os dois na MESMA rodada ao fim: '+stA().round);
    log('=== CENÁRIO COPAS: PASSOU ===','ok');
  }catch(e){ log(String(e&&e.message||e),'fail'); }
  finally{ stopRecorder(); window.__HRIG=null; window.__HDIV=null; }
}
/* ---- CENÁRIO 3: O CASO REAL QUE TRAVOU (sala 365ZV, 07/08/2026) ----
   Série A, os DOIS humanos FORA das continentais. Eles não jogam Libertadores nem Sul-Americana:
   tudo que fazem nesses dias é ASSISTIR — e assistir junto é o que vinha falhando. Vai até a
   jornada 3, que tem TRÊS copas no mesmo bloco (Lib + Sula + Copa do Brasil) antes do jogo de liga.

   O que este cenário mede, e o cenário 2 não media:
     · o ponteiro nunca pode falar de uma jornada à frente da sala (foi assim que ele chegou à
       jornada 4 com a sala na 3, e o desacordo devolveu a decisão pro palpite local);
     · os dois nunca podem estar ao vivo em competições diferentes ao mesmo tempo;
     · a distância entre as jornadas dos dois nunca passa de 1 (na 365ZV chegou a 3). */
async function scenario3(){
  try{
    hz.timerMs=8000; hz.games={}; CODE=null;
    window.__HDIV='A'; window.__HRIG='sem-copas';
    fA.src='/?harness=A&t='+Date.now(); fB.src='/?harness=B&t='+Date.now();
    await sleep(1400);
    await setup();
    await sleep(200);
    start(); startRecorder();
    await waitFor(()=>stA().netStep==='reveal'&&stB().netStep==='reveal','reveal nos DOIS');
    await fastUntil(['main'],'cerimônias até o clube — Série A, ninguém nas continentais',300000);
    log('clubes: A='+stA().myClub+' · B='+stB().myClub+' (nenhum joga Lib/Sula)','info');
    assert(!!hz.games[CODE].day_plan,'a sala gravou o calendário de dias');

    // autopiloto: o runner só faz o papel dos DEDOS; tudo é validado pelo histórico depois
    const t0=Date.now(); let poke=0;
    while(hz.games[CODE].round<4 && Date.now()-t0<1500000){
      const g=hz.games[CODE];
      if(g.phase==='ready' && Date.now()-poke>3000){ poke=Date.now();
        try{ if(stA().screen==='main'&&!stA().live) A().__h.jogar(); }catch(e){}
        try{ if(stB().screen==='main'&&!stB().live) B().__h.jogar(); }catch(e){}
      }
      try{ A().__h.fast(); }catch(e){} try{ B().__h.fast(); }catch(e){}
      await sleep(250);
    }
    await waitFor(()=>hz.games[CODE].round>=4,'mundo atravessou a jornada 3 (Lib+Sula+CdB+liga)',60000);
    await fastUntil(['main'],'os dois de volta ao clube',240000);

    // ---------- ITEM 1: MESMA TELA, SEMPRE ----------
    const gap=Math.max(...hist.A.map((s,i)=>{ const b=hist.B[i]; return (b&&s.round!=null&&b.round!=null)?Math.abs(s.round-b.round):0; }));
    log('maior distância de jornada entre os dois: '+gap,'info');
    assert(gap<=1,'os dois nunca ficaram a mais de 1 jornada de distância (365ZV chegou a 3)');

    const divergiu=hist.A.filter((s,i)=>{ const b=hist.B[i];
      return b && s.live && b.live && (s.cupKey||'liga')!==(b.cupKey||'liga'); });
    log('instantes ao vivo em competições diferentes: '+divergiu.length,'info');
    assert(divergiu.length===0,'nunca estiveram ao vivo em competições diferentes');

    /* A ASSERÇÃO QUE FALTAVA — e a única que mede o item 1 como ele foi pedido.
       As duas acima medem jornada e "ao vivo em copas diferentes". Nenhuma pega "um no modal da
       Copa do Brasil, o outro na tela do elenco": ninguém está live, a jornada é a mesma, e as duas
       dão verde. Foi exatamente esse caso que o usuário pegou a olho numa captura enquanto eu
       anunciava que estava tudo certo. Item 1 é sobre a TELA, então mede-se a tela.
       Tolerância: telas de passagem não trocam no mesmo milissegundo nos dois clientes, então o que
       importa é quanto tempo elas ficam DIFERENTES, não se diferiram alguma vez. Acima de 15% do
       tempo não é transição — é um vivendo um momento do jogo que o outro não está vivendo. */
    let difTela=0, comparaveis=0;
    hist.A.forEach((s,i)=>{ const b=hist.B[i];
      if(!b || s.round==null || b.round==null) return;      // janela pré-temporada não conta
      comparaveis++; if(s.tela!==b.tela) difTela++; });
    const pct=comparaveis?Math.round(difTela*100/comparaveis):0;
    log('tempo em telas diferentes: '+difTela+'/'+comparaveis+' ('+pct+'%)','info');
    const amostras={}; hist.A.forEach((s,i)=>{ const b=hist.B[i];
      if(b && s.round!=null && b.round!=null && s.tela!==b.tela){
        const k=s.tela+' ‖ '+b.tela; amostras[k]=(amostras[k]||0)+1; } });
    const piores=Object.keys(amostras).sort((x,y)=>amostras[y]-amostras[x]).slice(0,5);
    if(piores.length) log('  pares mais frequentes: '+piores.map(k=>k+' ×'+amostras[k]).join(' | '),'info');
    // (1) MESMA TELA AO MESMO TEMPO. 10%: telas de passagem não trocam no mesmo milissegundo nos
    //     dois clientes, então alguma diferença é transição legítima. Acima disso não é atraso de
    //     renderização — é um vivendo um momento do jogo que o outro não está vivendo.
    assert(pct<=10,'(1) os dois passaram o tempo na MESMA tela ('+pct+'% de divergência)');

    // ---------- O PONTEIRO MANDA, E NÃO CORRE NA FRENTE ----------
    const adiante=hist.A.filter(s=>s.diaRound!=null && s.round!=null && s.diaRound>s.round);
    log('instantes com o ponteiro à frente da sala: '+adiante.length,'info');
    assert(adiante.length===0,'o ponteiro nunca falou de uma jornada à frente da sala');

    // `s.round!=null` NÃO é folga na medição: antes da temporada existir (lobby e cerimônias) o
    // cliente não tem jornada com que comparar, então roomDay() devolve null por falta de mundo,
    // não por divergência. Sem este filtro a asserção acusava 12 instantes de "palpite local" que
    // eram só a sala vazia — e um vermelho que sempre acende deixa de significar qualquer coisa.
    const palpite=s=>s.diaComp!=null && s.round!=null && !s.diaVale;
    const ignorado=hist.A.filter(palpite).length + hist.B.filter(palpite).length;
    log('instantes em que o cliente IGNOROU o ponteiro: '+ignorado,'info');
    assert(ignorado===0,'nenhum cliente caiu no palpite local (roomDay() nunca devolveu null)');

    // segurar por desacordo é obedecer — mas segurar SEMPRE é sala congelada. Mede as duas coisas:
    // sem este par, "ninguém divergiu" poderia significar só "ninguém jogou".
    const holdA=hist.A.filter(s=>s.diaHold).length, holdB=hist.B.filter(s=>s.diaHold).length;
    log('instantes segurando por desacordo: A='+holdA+'/'+hist.A.length+' B='+holdB+'/'+hist.B.length,'info');
    assert(holdA < hist.A.length*0.5 && holdB < hist.B.length*0.5,
      'a espera por desacordo é transitória, não o estado normal da sala');

    /* ========== AS TRÊS PERGUNTAS QUE IMPORTAM ==========
       A expectativa sai do PLANO DE DIAS DO SERVIDOR, não de uma lista escrita à mão aqui: o
       servidor diz o que devia ter acontecido, o histórico diz o que aconteceu, e a diferença é o
       defeito. Escrever a lista à mão me faria testar o que eu lembrei de testar — que é
       exatamente como três buracos passaram batidos até o usuário achá-los a olho. */
    const plano=hz.games[CODE].day_plan||[], rFim=hz.games[CODE].round;
    const eA0=entryCounts('A'), eB0=entryCounts('B');

    // (2) NINGUÉM PULA A LIGA — cada humano tem que ter ENTRADO no seu jogo do Brasileirão de
    //     TODA jornada já fechada. É o "pulou a rodada e nem viu o seu jogo", medido direto.
    const ligaFaltando=[];
    for(let r=0;r<rFim;r++){ const k=r+':liga';
      if(!eA0[k]) ligaFaltando.push('A@'+r); if(!eB0[k]) ligaFaltando.push('B@'+r); }
    log('jogos de liga não vistos: '+(ligaFaltando.length?ligaFaltando.join(', '):'nenhum'),'info');
    assert(ligaFaltando.length===0,'os dois viram o SEU jogo do Brasileirão em todas as '+rFim+' jornadas');

    // (3) TODOS VEEM TUDO — pra cada dia de copa do plano já cumprido, ou os DOIS entraram ou
    //     NENHUM entrou. Simetria em vez de lista fixa: um dia de copa pode não gerar confronto
    //     (chave vazia naquela fase), e o que não pode é um assistir e o outro não.
    const assimetria=[];
    plano.filter(e=>e.comp!=='liga' && e.r<rFim).forEach(e=>{ const k=e.r+':'+e.comp;
      if(!!eA0[k]!==!!eB0[k]) assimetria.push(k+' (A='+(eA0[k]||0)+' B='+(eB0[k]||0)+')'); });
    log('dias de copa vistos por só um deles: '+(assimetria.length?assimetria.join(', '):'nenhum'),'info');
    assert(assimetria.length===0,'todo dia de copa foi visto pelos DOIS ou por nenhum — nunca só por um');

    // e as continentais têm que ter de fato acontecido, senão a simetria acima seria verde à toa
    // (dois zeros são simétricos): sem isto, "ninguém divergiu" poderia ser "ninguém assistiu nada".
    const cupsVistas=Object.keys(eA0).filter(k=>k.indexOf(':liga')<0);
    log('dias de copa efetivamente assistidos: '+(cupsVistas.join(', ')||'NENHUM'),'info');
    assert(cupsVistas.some(k=>k.indexOf('libertadores')>=0),'a Libertadores foi assistida por quem não a disputa');
    assert(cupsVistas.some(k=>k.indexOf('sulamericana')>=0),'a Sul-Americana foi assistida por quem não a disputa');

    /* ---------- ITEM 3: OS DOIS NÚMEROS DA JORNADA TÊM QUE COINCIDIR ----------
       Enquanto o S.round for escrito pelo motor local E a jornada também sair do ponteiro, existem
       DUAS fontes de verdade pro mesmo número. Cortar a local no escuro seria trocar o dono da
       jornada sem saber se os dois já dizem a mesma coisa. Esta asserção é a licença pra corte:
       divergência instantânea não conta (o ponteiro só larga o dia quando o último assento
       carimba), divergência SUSTENTADA (>12s) conta — e tem que ser zero. */
    const driftA=stA().drift||0, driftB=stB().drift||0;
    log('divergências sustentadas ponteiro⇄jornada local: A='+driftA+' B='+driftB,'info');
    assert(driftA===0 && driftB===0,'a jornada do ponteiro nunca discordou da local por mais de 12s');

    /* ---------- POR QUE A SALA PAROU: O MOMENTO E OS CARIMBOS ----------
       Aqui se media o "ocupado" — a razão pela qual cada cliente segurava a sala. Esse conceito não
       existe mais: nada avança sem carimbo, então não há o que proteger com ele, e as três piores
       classes de travamento saíram junto. O que importa medir agora é o MOMENTO: a sala não pode
       passar a vida inteira num só, porque isso é exatamente uma espera que não termina. */
    const momentos=c=>{ const m={}; hist[c].forEach(s=>{ if(s.diaMom) m[s.diaMom]=(m[s.diaMom]||0)+1; }); return m; };
    const mmA=momentos('A');
    log('tempo em cada momento (A)='+JSON.stringify(mmA),'info');
    const totalMom=Object.values(mmA).reduce((a,b)=>a+b,0);
    const pior=Math.max(0,...Object.values(mmA));
    assert(!totalMom || pior < totalMom*0.8,'a sala não passou a execução inteira num momento só');

    // ---------- ANTI-LOOP E CHEGADA JUNTOS ----------
    const eA=entryCounts('A'), eB=entryCounts('B');
    log('entradas ao vivo A='+JSON.stringify(eA),'info'); log('entradas ao vivo B='+JSON.stringify(eB),'info');
    assert(Object.values(eA).every(n=>n===1),'A nunca reentrou numa etapa (anti-loop)');
    assert(Object.values(eB).every(n=>n===1),'B nunca reentrou numa etapa (anti-loop)');
    /* NINGUÉM PULOU NADA. entryCounts só pegava REENTRADA (loop); ausência passava calada — e
       "pulou a rodada e nem viu o próprio jogo" é ausência, não repetição. Os dois humanos vivem
       as MESMAS etapas, então os conjuntos de entradas têm que ser idênticos: o que um viveu e o
       outro não é exatamente uma etapa pulada. */
    const soA=Object.keys(eA).filter(k=>!eB[k]), soB=Object.keys(eB).filter(k=>!eA[k]);
    if(soA.length||soB.length) log('  etapas que só um viveu — A:'+JSON.stringify(soA)+' B:'+JSON.stringify(soB),'info');
    assert(soA.length===0 && soB.length===0,'nenhum dos dois pulou uma etapa que o outro viveu');
    assert(stA().round===stB().round,'os dois na MESMA jornada ao fim: '+stA().round);
    log('=== CENÁRIO 365ZV: PASSOU ===','ok');
  }catch(e){ log(String(e&&e.message||e),'fail'); }
  finally{ stopRecorder(); window.__HRIG=null; window.__HDIV=null; }
}
async function scenario(){
  try{
    hz.timerMs=8000;
    // estado limpo a cada execução: recarrega os dois clientes e zera o servidor
    hz.games={}; CODE=null;
    fA.src='/?harness=A&t='+Date.now(); fB.src='/?harness=B&t='+Date.now();
    await sleep(1200);
    await setup();
    await sleep(200);            // bcast assíncrono: join do B precisa aterrissar no A antes do start
    start();
    // 1) os DOIS veem o reveal do sorteio da Resenha
    await waitFor(()=>stA().netStep==='reveal'&&stB().netStep==='reveal','reveal do sorteio nos DOIS clientes');
    // 2) cerimônias: boas-vindas + sorteios de copa nos DOIS; o relógio NÃO pode armar
    await fastUntil(['main'],'os dois atravessam boas-vindas + cerimônias até a tela do clube',90000);
    const g=G(CODE);
    assert(g.phase==='ready','fase continua ready após cerimônias');
    // 3) A marca pronto; B ainda não -> fase NÃO avança
    A().__h.jogar(); await sleep(1500);
    assert(G(CODE).phase==='ready','A pronto sozinho não inicia a rodada');
    assert(stB().live===false,'B não entrou em campo antes da largada');
    // 4) B marca pronto -> largada pra TODOS (sem esperar o prazo)
    B().__h.jogar();
    await waitFor(()=>G(CODE).phase==='running','fase running com todos prontos (sem esperar o cronômetro)',15000);
    await waitFor(()=>stA().live===true&&stB().live===true,'os DOIS em campo',20000);
    A().__h.speedUp(); B().__h.speedUp();
    // 5) fim da rodada: publica, host fecha localmente, shared_state avança
    await waitFor(()=>G(CODE).round>=1,'rodada fechada e shared_state na rodada 1',240000);
    // 6) telas pós-rodada nos DOIS + ninguém reentra na rodada 0
    await fastUntil(['main'],'os dois atravessam classificações e voltam ao clube',120000);
    const k0=Object.keys(stA().stageDone).length && Object.keys(stB().stageDone).length;
    assert(k0,'etapa 0 marcada como cumprida nos dois (anti-replay)');
    assert(stA().round===stB().round,'os dois na MESMA rodada ao fim: '+stA().round);
    log('=== CENÁRIO LOCKSTEP: PASSOU ===','ok');
  }catch(e){ log(String(e&&e.message||e),'fail'); }
}
