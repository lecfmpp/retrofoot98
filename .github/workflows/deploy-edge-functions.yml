# Deploy da edge function resolve-round no Supabase.
#
# POR QUE existe: a CLI local está autenticada numa conta que NÃO é dona deste projeto
# (o keychain guarda um token só, e aqui há contas diferentes por projeto), então
# `supabase functions deploy` dá 403 na máquina. O caminho que sobrava era o MCP com o
# arquivo inline — ~57KB retransmitidos a cada deploy, caro e com risco de erro de
# transcrição num resolvedor de produção. Aqui o token vive nos secrets do repositório,
# o deploy é por arquivo, e a conta certa é usada sempre.
#
# SETUP (uma vez): crie um Personal Access Token em
#   https://supabase.com/dashboard/account/tokens
# LOGADO NA CONTA DONA da organização "Investbola" (a que enxerga o projeto
# alxwgqvjmetjbbqtjkhx) e guarde em
#   github.com/lecfmpp/retrofoot98 -> Settings -> Secrets and variables -> Actions
#   -> New repository secret -> nome: SUPABASE_ACCESS_TOKEN
name: Deploy edge functions

on:
  push:
    branches: [main]
    # só roda quando a função muda de verdade — commit de cliente (public/) não
    # redeploya o servidor à toa
    paths: ['supabase/functions/**', '.github/workflows/deploy-edge-functions.yml']
  workflow_dispatch:        # permite disparar na mão pela aba Actions

concurrency:
  # dois pushes seguidos não podem deployar em paralelo: o último a terminar venceria,
  # e não necessariamente é o commit mais novo
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  PROJECT_REF: alxwgqvjmetjbbqtjkhx      # público (está na URL da API), não é segredo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # PORTÃO: um erro de sintaxe aqui derruba a resolução de rodada de todas as salas
      # em andamento. O esbuild que já vem com o vite faz o parse completo do TS.
      # NOTA (27/08): aqui dizia que `deno check` "não serve" porque quebrava a resolver
      # tipos de uma dependência alheia (npm:openai do edge-runtime.d.ts). É verdade sem
      # flag — e `--node-modules-dir=auto` resolve. Ele voltou, mais abaixo, porque
      # esbuild NÃO vê nome indefinido, e foi assim que a coach-avatar subiu quebrada.
      - name: Instalar dependências
        run: npm ci

      # PORTÃO DA FOLHA ÚNICA: falha o deploy se o bloco WORLD_RULES dentro do resolve-round não
      # for idêntico a public/src/engine/world-rules.js. É o que impede cliente e servidor de
      # voltarem a ter duas versões da mesma regra — a causa dos "dois jogos no mesmo dia".
      - name: Regras de mundo em dia (cliente = servidor)
        run: node scripts/sync-world-rules.mjs --check

      # PORTÃO DO CALENDÁRIO: nenhuma competição pode aparecer no plano de dias fora da ordem em
      # que se joga, e nenhuma rodada pode ficar sem dia. Foi assim que a final da Sul-Americana
      # ficou agendada ANTES da própria semifinal nas três salas de agosto/2026 — o dia da final
      # chegava sem finalistas e a temporada virava por cima da decisão.
      - name: Calendário íntegro (a final nunca antes da semifinal)
        run: node scripts/teste-calendario.mjs

      # PORTÃO DA PIRÂMIDE: o servidor deixou de ter a pirâmide brasileira congelada e passou a
      # lê-la de UNIVERSOS. Este teste prova que o Brasil continua byte a byte o que era — a
      # virada de temporada roda uma vez a cada 38 jornadas, e um erro aqui só apareceria em
      # dezembro, com a sala inteira dentro.
      - name: Pirâmide de país íntegra (Brasil inalterado)
        run: node scripts/teste-universos.mjs

      # PORTÃO DA VIRADA: carrega o resolve-round de verdade num contexto de Node e roda a virada
      # de temporada em três países. É o bloco mais perigoso da função — promoção, rebaixamento,
      # aposentadoria, regen, copas novas — e roda uma vez a cada 38 jornadas, então sem isto um
      # erro só apareceria em dezembro, com a sala inteira dentro.
      - name: Virada de temporada íntegra
        run: node scripts/teste-virada.mjs

      - name: Validar sintaxe das funções
        run: |
          npx esbuild supabase/functions/resolve-round/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/kickoff-round/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/generate-image/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/coach-avatar/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/player-avatar/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/criar-checkout/index.ts --outfile=/dev/null --platform=neutral --format=esm
          npx esbuild supabase/functions/stripe-webhook/index.ts --outfile=/dev/null --platform=neutral --format=esm

      # ESBUILD SÓ VÊ SINTAXE. Uma constante APAGADA por engano passa por ele sem
      # um pio e só aparece em produção, como ReferenceError em tempo de execução
      # — foi exatamente o que derrubou a coach-avatar (TETO_GERACOES apagada num
      # recorte de texto largo demais, deploy verde, 500 sem CORS para o jogador).
      # `deno check` é quem acusa nome que não existe. O smoke test abaixo também
      # não pega: ele só chega ao 401, muito antes destas linhas.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # SÓ A coach-avatar POR ENQUANTO, e isso é deliberado: resolve-round,
      # kickoff-round e generate-image são JS antigo escrito em .ts e acusam
      # dezenas de TS7006/TS2554 pré-existentes. Tipá-las é trabalho à parte —
      # e mexer no resolve-round, que fecha rodada de sala ao vivo, não se faz
      # de passagem. O portão nasce cobrindo o que está limpo; cada função que
      # for saneada entra nesta lista.
      - name: Conferir nomes da coach-avatar e das funcoes de pagamento
        run: |
          deno check --config scripts/deno-check.json \
            supabase/functions/coach-avatar/index.ts \
            supabase/functions/player-avatar/index.ts \
            supabase/functions/criar-checkout/index.ts \
            supabase/functions/stripe-webhook/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy NOMEADO, não "todas": as outras funções do projeto (send-invite-email,
      # fetch-division-data, verify-round-result) não estão neste repositório, e um
      # deploy genérico poderia reescrever a configuração delas.
      # Sem --no-verify-jwt de propósito: estas quatro exigem JWT (o padrão da CLI).
      # O CARIMBO DO MOTOR TEM QUE ESTAR EM DIA ANTES DE PUBLICAR. Se o servidor subir
      # com carimbo velho, ele grava esse carimbo no estado da sala e TODO cliente novo
      # se acha divergente — o aviso de recarga apareceria para quem está certo.
      - name: Conferir carimbo do motor
        run: node scripts/versao-motor.mjs --servidor

      - name: Deploy resolve-round e kickoff-round
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy resolve-round --project-ref "$PROJECT_REF"
          supabase functions deploy kickoff-round --project-ref "$PROJECT_REF"
          supabase functions deploy generate-image --project-ref "$PROJECT_REF"
          supabase functions deploy coach-avatar --project-ref "$PROJECT_REF"
          supabase functions deploy player-avatar --project-ref "$PROJECT_REF"
          supabase functions deploy criar-checkout --project-ref "$PROJECT_REF"

      # send-password-reset é a EXCEÇÃO e vai sozinha: quem esqueceu a senha não tem
      # sessão, então ela precisa continuar pública. Sem --no-verify-jwt o deploy a
      # trancaria atrás de um JWT que o usuário não tem, e o "esqueci minha senha"
      # morreria com 401 — por isso a flag não é opcional aqui.
      # stripe-webhook vai SEM JWT pelo mesmo motivo da send-password-reset, e o
      # motivo aqui é ainda mais forte: quem chama é o servidor do Stripe, que não
      # tem sessão de utilizador nenhuma. A porta dela é a assinatura HMAC do
      # corpo, conferida dentro da função — trancá-la atrás de JWT faria todo
      # evento de pagamento morrer com 401, e o plano nunca chegaria a quem pagou.
      - name: Deploy stripe-webhook (pública, sem JWT — a porta é a assinatura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy send-password-reset (pública, sem JWT)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-password-reset --project-ref "$PROJECT_REF" --no-verify-jwt

      # As funções têm que SUBIR, não só compilar. Sem Authorization o gateway responde 401 —
      # é o sinal de que o worker bootou. 5xx aqui significa erro em tempo de boot.
      - name: Verificar que as funções sobem
        run: |
          for fn in resolve-round kickoff-round generate-image coach-avatar player-avatar criar-checkout; do
            ok=0
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST \
                "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}" \
                -H 'Content-Type: application/json' -d '{"gameId":"smoke"}')
              echo "$fn tentativa $i -> HTTP $code : $(head -c 160 /tmp/r.txt)"
              if [ "$code" = "401" ]; then echo "OK: $fn no ar"; ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "FALHOU: esperava 401 ($fn no ar), veio $code"; exit 1; fi
          done

      # stripe-webhook é pública: 401 aqui seria BUG (o Stripe não manda JWT).
      # Sem cabeçalho de assinatura ela responde 400 — é esse 400 que prova ao
      # mesmo tempo que o worker subiu E que segue pública. Repare que isto vale
      # ANTES de as chaves do Stripe existirem: a função confere a assinatura
      # antes dos secrets justamente para este portão não depender delas.
      - name: Verificar que stripe-webhook sobe e segue pública
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/stripe-webhook" \
              -H 'Content-Type: application/json' -d '{}')
            echo "stripe-webhook tentativa $i -> HTTP $code : $(head -c 160 /tmp/r.txt)"
            if [ "$code" = "400" ]; then echo "OK: no ar e pública"; ok=1; break; fi
            if [ "$code" = "401" ]; then echo "FALHOU: subiu exigindo JWT — todo evento de pagamento morreria"; exit 1; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "FALHOU: esperava 400, veio $code"; exit 1; fi

      # send-password-reset é pública: 401 aqui seria BUG, não saúde. Sem e-mail no
      # corpo ela responde 400 ("Informe um e-mail válido") — é esse 400 que prova
      # ao mesmo tempo que o worker subiu E que continua sem exigir JWT.
      - name: Verificar que send-password-reset sobe e segue pública
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/send-password-reset" \
              -H 'Content-Type: application/json' -d '{}')
            echo "send-password-reset tentativa $i -> HTTP $code : $(head -c 160 /tmp/r.txt)"
            if [ "$code" = "400" ]; then echo "OK: no ar e pública"; ok=1; break; fi
            if [ "$code" = "401" ]; then echo "FALHOU: subiu exigindo JWT — o link de recuperação quebraria"; exit 1; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "FALHOU: esperava 400, veio $code"; exit 1; fi
